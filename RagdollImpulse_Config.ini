[RagdollImpulse]
Enabled=1
DebugLogging=1

; EXPERIMENTAL: delayed cached actor calls may crash; use a disposable save.
; Appends/flushed actor-call breadcrumbs next to this DLL; adds diagnostic disk I/O.
; Preserve RagdollImpulse_CrashTrace.log and RE_Kenshi_log.txt after a crash.
CrashTrace=0

; Wait at least this many real-time milliseconds after native ragdoll setup.
; Apply once on the first unpaused main-loop tick after the delay (range 1..500).
; This is wall-clock time, not scaled by 0.5x gameplay speed. Long stalls/pauses
; expire cached actors after 1500ms rather than applying an old hit later.
ImpulseDelayMs=40

; Restart Kenshi after editing. Keep comments on separate lines.
; Final post-armour melee damage must meet this threshold.
MinDamage=1.0

; Preserved from your installed test tuning on September 19.
; Requested horizontal impulse H = min(BaseImpulse + FinalDamage * DamageScale, MaxImpulse).
; With base=cap=8000, every eligible hit reaches H=8000 regardless of damage.
; The optional mass/speed limiter below is OFF for this delayed-force test.
BaseImpulse=10.0
DamageScale=15.0
MaxImpulse=6000.0

; Total vertical component before the vertical cap.
UpwardImpulse=6.0

; Kenshi cut direction steers one impulse, not a scripted reaction.
; Left/right add opposite lateral components; thrust/default/pierced stay straight
; away from the attacker. Horizontal length remains H.
; Up/down add +/- H * SwingDirectionCoefficient to UpwardImpulse.
; Presets for steering: 0.05 subtle, 0.15 balanced, 0.30 strong.
SwingDirectionCoefficient=0.30

; Caps the base vertical impulse budget, including UpwardImpulse.
; High vertical motion may be suppressed by BetterPhysics.
MaxDirectionalVerticalImpulse=1050.0

; Fraction distributed across all eligible bodies in proportion to mass.
; The remaining fraction targets the matched hit bone (or matching body area).
; 0.00 = all on the struck body; 0.15 = strongly localized; 1.00 = whole-body shove.
; Lower values allow arms/legs to lag while the hit region leads.
; No bone/area match: fall back to mass-distributed force, logged explicitly.
ImpactSpread=0.15

; OPTIONAL maximum added speed per actor, in uncalibrated engine velocity units.
; DeltaSpeed = length(ActorImpulse) / ActorMass.
; 0 = disabled. Positive values limit the final added speed.
; Positive values up to 100000 reduce ALL shares if any actor exceeds the value.
; POC11's 30 reduced a 7500 request to about 34.82 on a 13-body mass-one rig.
; Keep 0 for the initial test. Tune BaseImpulse/DamageScale/MaxImpulse for strength.
; With this disabled, safety_scale should be 1.00000 in the log.
MaxActorSpeedChange=0.0

; NEW: additional world-space angular impulse ONLY on the matched hit bone/area.
; L = (-attacker-to-victim unit direction * coefficient) CROSS cut-directed J.
; The coefficient is a tunable EFFECTIVE lever arm in uncalibrated engine units,
; not a measured blade-contact radius. Constant upward lift does not create twist.
; Left/right cuts mirror the twist; up/down cuts mirror the tipping rotation.
; Straight thrusts and unknown-region fallback receive no added angular impulse.
; This angular calculation and its separate cap remain unchanged from POC13.
; 0 = OFF (POC12-style linear-only behavior). Allowed range 0..100.
; Starting suggestions: 0.5 restrained, 1.0 initial test, 2.0 stronger.
RotationalImpulseCoefficient=1.0

; Caps the TOTAL angular impulse magnitude per hit, BEFORE splitting among any
; area-matched targets. Does not reduce or redistribute the existing linear force.
; At H=8000 and swing=0.30, side-cut torque exceeds the 1500 cap.
; These are not degrees or RPM. Native adapter support is required for torque.
; Allowed range 0..100000. 0 also disables added rotation.
MaxRotationalImpulse=1500.0

; Retired and ignored in this build:
; ExpectedActorCount, CaptureGraceMs, AngularImpulseCoefficient, MaxAngularImpulse,
; ReactionVariation, Head/Torso/Arm/LegSpinMultiplier, their LiftMultiplier keys,
; and LegHorizontalMultiplier.
; These retired AngularImpulseCoefficient/MaxAngularImpulse keys used the old
; alternating-force flair scheme, NOT the new Rotational... settings above.
; Spins/folds come from localized linear + angular impulses and native joints.
; No named reaction routine, pose override, or teleport is added.
